{% extends 'base.html' %}

{% block title %}Excluir Veículo - AutoPrime{% endblock %}

{% block content %}
<h1>Confirmar exclusão</h1>

<p>Tem certeza que deseja excluir o veículo
    <strong>{{ veiculo.marca }} {{ veiculo.modelo }} - {{ veiculo.placa }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'veiculo_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
