<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Veículos</title>
</head>
<body>
    <h1>Veículos Cadastrados</h1>

    <table border="1">
        <tr>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Ano</th>
            <th>Placa</th>
            <th>Cor</th>
            <th>Proprietário</th>
        </tr>
        {% for veiculo in veiculos %}
        <tr>
            <td>{{ veiculo.marca }}</td>
            <td>{{ veiculo.modelo }}</td>
            <td>{{ veiculo.ano }}</td>
            <td>{{ veiculo.placa }}</td>
            <td>{{ veiculo.cor }}</td>
            <td>{{ veiculo.proprietario }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
